# Builds the Next.js static export on `main` and publishes it to `master`,
# the branch GitHub Pages serves for rocknrold.github.io.
#
# Hardening: least-privilege token per job, actions pinned to commit SHAs
# (Dependabot keeps them current), no persisted git credentials, no npm
# install scripts, and the export is verified before anything is published.
name: Build and deploy to master

on:
  push:
    branches: [main]
  # Monthly rebuild so computed values in the static JSON API (experience_years,
  # role durations) stay current with no manual updates. The page itself
  # recomputes them in the browser. Note: GitHub only runs schedules from the
  # repository's default branch, so `main` must be the default branch.
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of every month
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: deploy-master
  # Never cancel a deploy halfway through pushing to master.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      - name: Build static export (adds hashed CSP to every page)
        run: npm run build

      - name: Verify export before publishing
        run: npm run verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out
          include-hidden-files: true # keeps .nojekyll and .well-known/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the built site to master
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out

      - name: Publish build to master
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./out
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "deploy: ${{ github.sha }}"
